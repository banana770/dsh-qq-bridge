# dsh-qq-bridge profile patch layer — insert one loader entry for the plugin
# package. The host half (lib/index.js) supervises the QQ bridge subprocess
# (dsh-qq-bridge/src/main.js) and serves the /qqb/* HTTP routes; the browser
# half is picked up by dsh-client-modules through the package's dsh.client
# declaration, exactly like the shipped ui-* packages and dsh-skin.
- insert:
    - id: qqb-bridge
      name: 'dsh-qq-bridge'
